databases:
  - name: light-textiles-db
    plan: basic-256mb
    region: frankfurt
    postgresMajorVersion: "16"

services:
  - type: web
    name: light-textiles
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    preDeployCommand: npx prisma migrate deploy
    healthCheckPath: /uk
    autoDeployTrigger: off
    disk:
      name: uploads
      mountPath: /opt/render/project/src/public/uploads/media
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: light-textiles-db
          property: connectionString
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: NODE_ENV
        value: production
